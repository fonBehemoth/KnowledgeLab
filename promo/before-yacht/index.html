window.renderFrame=function(t){const intro=1-fade(t,3.1,3.85),metrics=fade(t,3.1,3.85)*(1-fade(t,6.3,7)),proc=fade(t,6.3,7);set('introTitle',intro,0,-12*(1-intro));set('metricsTitle',metrics,0,12*(1-metrics));set('processTitle',proc,0,14*(1-proc));set('documents',1-fade(t,5.7,6.5),-28*fade(t,3.2,5.9),0);set('world',1-proc,0,-20*proc);set('metricCards',fade(t,2.6,3.6),25*(1-fade(t,2.6,3.6)),0);['doc1','doc2','doc3'].forEach((id,j)=>$(id).setAttribute('transform',`translate(${Math.sin(t*.9+j)*4} ${Math.sin(t*.7+j)*7})`));['m1','m2','m3'].forEach((id,j)=>$(id).setAttribute('transform',`translate(${28*(1-fade(t,2.7+j*.25,3.35+j*.25))} 0)`));set('process',proc,0,30*(1-proc));const highlight=fade(t,7.6,8.3);$('manualBorder').setAttribute('opacity',highlight);set('candidate',fade(t,8,8.7),0,15*(1-fade(t,8,8.7)));$('bottomText').textContent=t<3.5?'Документы · отчёты · аудио · внутренние данные':t<6.7?'Понятные показатели и основания выводов':'Найдём ручные операции и возможности автоматизации';buildStreams(t);crystal(t);let h='';if(proc>0){for(let j=0;j<4;j++){const x=(j%2?1140:645)+((t*.35+j*.25)%1)*115;h+=`<circle cx="${x}" cy="525" r="5" fill="#65a5c6" opacity=".8"/>`;}}$('processPackets').innerHTML=h;};let start=performance.now();const tick=()=>{if(!window.captureMode)window.renderFrame(((performance.now()-start)/1000)%12);requestAnimationFrame(tick)};window.renderFrame(0);requestAnimationFrame(tick);})();

const originalRender=window.renderFrame;

for(const [id,a,b] of ranges){const v=E((t-a+.4)/.8)*(id==='sInfra'?1:1-E((t-b+.4)/.8));O(id,v);document.getElementById(id).setAttribute('transform',`translate(0 ${18*(1-v)})`)}

O('taskStatus',E((t-61.5)/.4));O('assignButton',1-E((t-61.5)/.4));O('approval',E((t-71.5)/.4));O('approveButton',1-E((t-71.5)/.4));document.getElementById('infraPacket').setAttribute('cx',552+((t-76)*.45%1)*97);
