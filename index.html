<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepAgent AI — Центрифуга</title><style>
@font-face{font-family:DIN;src:url(assets/DINPro-Regular.ttf)}@font-face{font-family:DIN;src:url(assets/DINPro-Bold.ttf);font-weight:700}
:root{color-scheme:light;--bg:#edf3f7;--panel:#f8fbfd;--inside:#eef4f8;--line:#c7d8e2;--green:#276d91;--text:#294556;--muted:#5e7686;--orange:#936b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px DIN,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:4px}button:disabled{cursor:default;opacity:.4}button{transition:background .18s,border-color .18s,color .18s}header{height:100px;padding:24px 34px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:35px;font-weight:700;letter-spacing:-1px}.brand span{color:var(--green)}.maker{font-size:11px;color:var(--muted);letter-spacing:2.5px;margin-top:3px}.header-right{display:flex;align-items:center;gap:24px}.prototype{font-size:12px;color:var(--muted)}.play{background:transparent;border:1px solid #a5bfce;color:var(--green);padding:10px 16px;border-radius:8px}.body{display:grid;grid-template-columns:365px minmax(0,1fr);gap:24px;padding:0 28px 24px;min-height:calc(100vh - 100px)}.sidebar,.workspace{background:var(--panel);border:1px solid var(--line);border-radius:20px}.sidebar{padding:22px;align-self:start}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;font-weight:700}.firms{margin:12px 0 8px;display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px}.arrow{height:42px;background:transparent;border:1px solid #c4d5df;border-radius:7px;color:var(--muted);font-size:23px}.firm{background:var(--inside);border:1px solid #85adc4;border-radius:10px;padding:15px 8px;text-align:center;min-width:0}.firm strong{color:var(--green);font-size:19px;display:block}.firm small{color:var(--muted);font-size:12px}.firm-dots{display:flex;justify-content:center;align-items:center;gap:9px;margin:10px 0 19px}.firm-dots button{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:#a9bdca}.firm-dots button.active{width:24px;border-radius:5px;background:var(--green)}.neighbors{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:3px 2px 12px}.main-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.main-tabs button{background:var(--inside);border:1px solid #cfdee7;border-radius:8px;padding:14px 3px;font-size:13px}.main-tabs button.active{background:#dcebf4;border-color:var(--green);color:var(--green)}.connector{height:20px;display:flex;justify-content:center}.connector:after{content:'';height:100%;width:1px;background:#a9c3d2}.types{display:grid;grid-template-columns:1fr 1fr;gap:9px}.types button{background:var(--inside);border:1px solid #cfdee7;border-radius:8px;padding:11px;font-size:14px}.types .active{border-color:var(--green);color:var(--green);background:#dcebf4}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0 24px}.roles button{aspect-ratio:1;border:1px solid #bfd2de;border-radius:50%;background:var(--inside);font-size:11px;padding:3px}.roles button.active{color:var(--green);border-color:var(--green);box-shadow:0 0 0 4px #276d9114}.subnav{display:flex;flex-direction:column;gap:8px}.subnav button{display:flex;justify-content:space-between;align-items:center;border:1px solid #cfdee7;background:var(--inside);padding:14px;border-radius:8px;text-align:left;font-size:15px}.subnav .active{background:#e7f0f6;border-left:3px solid var(--green);padding-left:12px}.badge{border-radius:4px;background:#f0e3cc;color:var(--orange);font-size:12px;padding:2px 6px}.left-foot{margin-top:24px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px}.workspace{padding:18px;display:flex;flex-direction:column;min-width:0;min-height:720px}.work-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 16px 23px;border-bottom:1px solid #d4e0e8}.breadcrumb{font-size:13px;color:var(--muted)}.connection{font-size:12px;color:var(--muted);white-space:nowrap}.content{padding:28px 26px;flex:1;min-width:0}.content h1{font-size:29px;margin:0 0 9px;font-weight:700}.subtitle{font-size:14px;color:var(--muted);margin:0 0 25px}.person-head{display:flex;align-items:center;gap:15px;margin-bottom:25px}.avatar{height:49px;width:49px;background:#dfedf5;border:1px solid #94b8cc;display:grid;place-items:center;color:var(--green);border-radius:12px;font-size:18px;font-weight:700}.person-head strong{font-size:18px}.person-head small{display:block;margin-top:4px;color:var(--muted);font-size:13px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}.pill{background:#e5f0f6;color:#376b85;border:1px solid #b7d0df;border-radius:5px;font-size:12px;padding:7px 10px}.data-row{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid #d4e0e8}.data-row strong{font-weight:400}.data-row small{font-size:13px;color:var(--muted)}.primary{background:var(--green);color:#ffffff;font-weight:700;border:0;border-radius:8px;padding:13px 20px}.secondary{background:var(--inside);border:1px solid #b9cfdd;border-radius:8px;padding:11px 16px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.task{border:1px solid #c8dae5;border-radius:12px;background:var(--inside);padding:22px;margin-bottom:16px}.task h2{font-size:21px;margin:8px 0 13px}.task p{font-size:15px;line-height:1.5;color:#4e697b;margin:9px 0}.status{font-size:11px;color:var(--green);letter-spacing:.6px;text-transform:uppercase}.warning{color:var(--orange)}.task-meta{display:flex;gap:26px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:16px}.text-input{width:100%;background:#ffffff;border:1px solid #b9cfdd;color:var(--text);border-radius:7px;padding:12px;font-size:15px}.text-label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}.notice{border-left:3px solid var(--orange);padding:12px 15px;background:#f6eedf;color:#80602e;font-size:14px;margin:18px 0}.report-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.report-metric{background:var(--inside);padding:18px;border-radius:10px}.report-metric span{color:var(--muted);font-size:13px}.report-metric strong{display:block;font-size:29px;margin:9px 0}.report-metric small{color:var(--muted);font-size:12px}.chart{width:100%;height:170px;margin:14px 0 20px}.thread{margin-top:18px;display:flex;flex-direction:column;gap:10px}.message{background:#e7f0f6;padding:15px 18px;font-size:14px;line-height:1.55;border-radius:10px;max-width:90%}.message.user{background:#dcecf6;align-self:flex-end}.message small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.composer{margin:0 14px 10px;border:1px solid #b6cdda;border-radius:13px;background:var(--inside);padding:13px 15px}.composer-context{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;margin-bottom:10px}.composer-line{display:flex;gap:10px;align-items:center}.composer textarea{flex:1;resize:none;background:transparent;border:0;color:var(--text);min-height:30px;height:32px;padding:3px;font-size:16px}.send{height:37px;width:43px;border:0;border-radius:7px;background:var(--green);color:#ffffff;font-size:22px}.footer-note{margin:0 18px 3px;color:var(--muted);font-size:10px}.film header .prototype,.film .footer-note{visibility:hidden}.film .play{opacity:.5}.tour-line{height:2px;background:#276d911a;position:fixed;bottom:0;left:0;right:0}.tour-line div{height:2px;width:0;background:var(--green);transition:width .15s linear}.pulse{animation:pulse 1.2s ease-out}@keyframes pulse{0%{box-shadow:0 0 0 0 #276d9133}100%{box-shadow:0 0 0 12px #2eff5800}}@media(min-width:1600px){.body{grid-template-columns:430px 1fr}.sidebar{padding:26px}.roles button{font-size:13px}.main-tabs button{font-size:15px}.workspace{min-height:850px}.content{padding:35px}.content h1{font-size:34px}}@media(max-width:900px){header{height:auto;padding:20px}.brand{font-size:27px}.header-right{gap:10px}.body{grid-template-columns:1fr;padding:0 16px 16px}.workspace{min-height:600px}.roles{max-width:340px}.content{padding:20px 10px}.report-metrics{grid-template-columns:1fr}.composer{margin:0 0 10px}.prototype{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Light palette drawn from the silver, glass blue and warm gold presentation. */
body{background:radial-gradient(ellipse at 18% 0%,#ffffff 0%,transparent 55%),linear-gradient(130deg,#f3f7fa 0%,#edf3f7 55%,#e4eef4 100%);background-attachment:fixed}
header{border-top:3px solid transparent;border-image:linear-gradient(90deg,#6aa1bd,#d3e7f2 65%,#dbc399) 1}
.brand{color:#294556}.brand span{color:#276d91}

</style></head><body><header><div><div class="brand"><span>DeepAgent</span> AI</div><div class="maker">ПРОДУКТ КОМПАНИИ «ЦЕНТРИФУГА»</div></div><div class="header-right"><span class="prototype">ДЕМО · УСЛОВНЫЕ ДАННЫЕ</span><button class="play" id="tour">▶ Показать маршрут</button></div></header><div class="body"><aside class="sidebar"><div class="label">Выбор фирмы</div><div class="firms" id="firms" aria-label="Переключение фирм колесом мыши"><button class="arrow" id="previous-firm" aria-label="Предыдущая фирма">‹</button><div class="firm" id="firm-center"><strong id="firm-name"></strong><small id="firm-field"></small></div><button class="arrow" id="next-firm" aria-label="Следующая фирма">›</button></div><div class="neighbors"><span id="firm-left"></span><span id="firm-right"></span></div><div class="firm-dots" id="firm-dots"></div><nav class="main-tabs" aria-label="Разделы"><button data-section="Отдел">Отдел</button><button data-section="Проекты">Проекты</button><button data-section="Персонал">Персонал</button><button data-section="Отчёты">Отчёты</button></nav><div class="connector"></div><div id="person-controls"><div class="types"><button data-type="Штатный">Штатный</button><button data-type="ИИ-агенты">ИИ-агенты</button></div><div class="connector"></div><div class="roles" id="roles"></div></div><nav class="subnav" id="subnav" aria-label="Подразделы"></nav></aside><main class="workspace"><div class="work-top"><div class="breadcrumb" id="breadcrumb"></div><span class="connection"><i class="dot"></i>Контур предприятия</span></div><section class="content" id="content" aria-live="polite"></section><div class="composer"><div class="composer-context"><span id="ai-context"></span><span>DeepAgent AI</span></div><form class="composer-line" id="ask-form"><textarea id="question" aria-label="Вопрос ассистенту" placeholder="Задайте вопрос по выбранному разделу…"></textarea><button class="send" aria-label="Отправить вопрос">↑</button></form></div><p class="footer-note">Прототип для экранных сцен ролика. Ответы и интеграции демонстрационные.</p></main></div><div class="tour-line"><div id="tour-progress"></div></div><script>
(()=>{
const $=s=>document.querySelector(s);const firms=[{name:'Вектор',field:'Производство и торговля',money:'4,8',cost:'3,89'},{name:'Горизонт',field:'Логистика и склад',money:'2,6',cost:'2,11'},{name:'Альта',field:'Торговля и дистрибуция',money:'3,2',cost:'2,59'}];const roles=['Бухгалтер','Оператор','Менеджер','Аналитик'];const people=['Анна Волкова','Иван Орлов','Марина Соколова','Алексей Морозов'];const menus={Персонал:['Обязанности и функционал','Дополнительные задачи','Выполнено / Результаты','Настройки','Вопросы, требующие внимания'],Отдел:['Производство','Закупки','Продажи','Бухгалтерия'],Проекты:['Активные проекты','Задачи и участники','Согласования','Результаты проектов'],Отчёты:['Шаблонные отчёты','Отчёты сотрудников','Отчёт по запросу','Создать вид отчёта']};let s={firm:0,section:'Персонал',type:'ИИ-агенты',role:2,sub:'Обязанности и функционал'};let stores=firms.map(()=>({task:null,submitted:false,approved:false,questions:[]}));let tourTimer=null,tourStarted=0,tourRunning=false;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const person=()=>s.type==='ИИ-агенты'?roles[s.role]+' · ИИ':people[s.role];
function button(t,a,c='secondary'){return `<button class="${c}" data-action="${a}">${t}</button>`}function heading(t,sub){return `<h1>${t}</h1><p class="subtitle">${sub}</p>`}function personHead(){return `<div class="person-head"><div class="avatar">${s.type==='ИИ-агенты'?'AI':people[s.role].split(' ').map(x=>x[0]).join('')}</div><div><strong>${person()}</strong><small>${s.type==='ИИ-агенты'?'ИИ-агент':'Штатный сотрудник'} · ${roles[s.role]} · ${firms[s.firm].name}</small></div></div>`}function row(a,b){return `<div class="data-row"><strong>${a}</strong><small>${b}</small></div>`}
function changeFirm(delta){s.firm=(s.firm+delta+firms.length)%firms.length;render();$('#firm-center').classList.add('pulse')}
function render(){const f=firms[s.firm],stored=stores[s.firm],st=stored.task&&stored.task.assignee!==person()&&s.section==='Персонал'?{...stored,task:null,submitted:false,approved:false}:stored;$('#firm-name').textContent=f.name;$('#firm-field').textContent=f.field;$('#firm-left').textContent='‹ '+firms[(s.firm+2)%3].name;$('#firm-right').textContent=firms[(s.firm+1)%3].name+' ›';$('#firm-dots').innerHTML=firms.map((x,i)=>`<button data-firm="${i}" class="${i===s.firm?'active':''}" aria-label="Фирма ${x.name}" aria-pressed="${i===s.firm}"></button>`).join('');document.querySelectorAll('[data-section]').forEach(b=>{b.classList.toggle('active',b.dataset.section===s.section);b.setAttribute('aria-pressed',b.dataset.section===s.section)});$('#person-controls').hidden=s.section!=='Персонал';document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b.dataset.type===s.type);b.setAttribute('aria-pressed',b.dataset.type===s.type)});$('#roles').innerHTML=roles.map((r,i)=>`<button data-role="${i}" class="${i===s.role?'active':''}" aria-pressed="${i===s.role}">${r}</button>`).join('');$('#subnav').innerHTML=menus[s.section].map(m=>`<button data-sub="${m}" class="${s.sub===m?'active':''}"><span>${m}</span>${m==='Вопросы, требующие внимания'?'<span class="badge">1</span>':''}</button>`).join('');$('#breadcrumb').textContent=f.name+' / '+s.section+(s.section==='Персонал'?' / '+person():'');$('#ai-context').textContent='Контекст: '+f.name+' · '+s.section+' · '+(s.section==='Персонал'?person()+' · ':'')+s.sub;
let h='';if(s.section==='Персонал'){
h=personHead()+heading(s.sub,s.type==='ИИ-агенты'?'Регламент, поручения и результаты выбранного ИИ-агента':'Рабочие обязанности, поручения и результаты сотрудника');
if(s.sub==='Обязанности и функционал'){const duties=[['Проверка первичных документов','Подготовка финансовой отчётности','Контроль расхождений'],['Обработка входящих заявок','Обновление статусов операций','Передача исключений руководителю'],['Координация задач подразделения','Контроль сроков и согласований','Подготовка сводного отчёта'],['Сопоставление данных предприятия','Выявление отклонений','Подготовка выводов с источниками']][s.role];h+='<div class="pills"><span class="pill">Правила согласованы</span><span class="pill">Решения под контролем руководителя</span></div>'+duties.map((x,i)=>row(x,'Регламент '+(i+1))).join('')+'<div class="actions">'+button('Поставить дополнительную задачу','task','primary')+button('Открыть результаты','results')+'</div>';}
else if(s.sub==='Дополнительные задачи'){if(st.task){h+=`<div class="task"><span class="status">${st.submitted?'Выполнено · ожидает согласования':'Назначена'}</span><h2>${esc(st.task.title)}</h2><p>${esc(st.task.detail)}</p><div class="task-meta"><span>Исполнитель: ${esc(st.task.assignee)}</span><span>Срок: ${esc(st.task.deadline)}</span></div></div><div class="actions">${st.submitted?button('Открыть результат','results','primary'):button('Показать выполнение в демо','finish','primary')}${button('Новое поручение','new-task')}</div>`;}else{h+='<div class="task"><span class="status">Новое поручение</span><label class="text-label" for="task-title">Задача</label><input class="text-input" id="task-title" value="Выяснить причины снижения маржи"><label class="text-label" for="task-detail">Материалы и требования</label><textarea class="text-input" id="task-detail" rows="3">Сопоставить закупки, производство и продажи. Указать источники выводов и предложить план действий.</textarea><label class="text-label" for="task-deadline">Срок</label><input class="text-input" id="task-deadline" value="Сегодня, 15:00"><div class="actions">'+button('Назначить задачу','assign','primary')+'</div></div>';}}
else if(s.sub==='Выполнено / Результаты'){h+=st.submitted?'<div class="task"><span class="status">Анализ готов</span><h2>Причины снижения маржи</h2>'+row('Стоимость сырья выросла на 8%','Закупочные документы')+row('Доля отходов: 3,1% → 4,8%','Отчёт производства')+row('Изменилась структура продаж','Отчёт продаж')+'<p>Предлагается проверить условия закупок, разобрать потери на линии и пересмотреть ассортимент.</p><div class="actions">'+button(st.approved?'План согласован':'Согласовать план','approve','primary')+'</div></div>':'<div class="task"><h2>Дополнительная задача ещё не выполнена</h2><p>Здесь появится результат поручения с выводами и материалами.</p><div class="actions">'+button('Открыть поручение','task','primary')+'</div></div>';}
else if(s.sub==='Настройки'){h+='<div class="task"><h2>Правила и доступ</h2>'+row('Финансовые решения','Только после согласования')+row('Данные выбранной фирмы','Изолированный контекст')+row('Материалы для анализа','Закупки · производство · продажи')+'<label class="text-label" for="rules">Регламент</label><textarea class="text-input" id="rules" rows="3">Каждый вывод сопровождать источником. При недостатке данных передавать вопрос руководителю.</textarea><div class="actions">'+button('Сохранить регламент в демо','save','primary')+'</div><p id="save-message" class="subtitle"></p></div>';}
else{h+='<div class="task"><span class="status warning">Требуется решение руководителя</span><h2>Недостаточно данных по отходам</h2><p>Для проверки причины нужен отчёт по сменам. Запросить материал у начальника производства?</p><div class="actions">'+button('Разрешить запрос','resolve','primary')+'</div><p id="resolve-message" class="subtitle"></p></div>';}
}else if(s.section==='Отдел'){h=heading(s.sub,'Структура выбранного подразделения · '+f.name)+row('Штатные сотрудники',s.sub==='Производство'?'28 человек':'8 человек')+row('ИИ-агенты','2 роли')+row('Активные поручения','4 задачи')+row('Источники данных','Учётные системы предприятия')+'<div class="actions">'+button('Перейти к персоналу','personnel','primary')+button('Открыть финансовый отчёт','report')+'</div>';}
else if(s.section==='Проекты'){h=heading(s.sub,'Работа по проектам · '+f.name)+'<div class="task"><span class="status">В работе</span><h2>Оптимизация производственных потерь</h2><p>Сопоставление отчётов по сменам и подготовка плана действий.</p><div class="task-meta"><span>Участники: производство · закупки · аналитика</span><span>Следующий этап: согласование</span></div><div class="actions">'+button('Открыть исполнителя','personnel','primary')+'</div></div>';}
else{h=heading(s.sub,'Отчётность предприятия · '+f.name);if(['Шаблонные отчёты','Отчёты сотрудников'].includes(s.sub)){h+='<div class="task"><span class="status">Финансовые показатели · сентябрь</span><h2>Продажи растут. Маржа снижается.</h2><div class="report-metrics"><div class="report-metric"><span>Выручка</span><strong>'+f.money+' млн €</strong><small>Условные данные</small></div><div class="report-metric"><span>Себестоимость</span><strong>'+f.cost+' млн €</strong><small>Условные данные</small></div><div class="report-metric"><span>Валовая маржа</span><strong>19%</strong><small>Май: 24%</small></div></div><svg class="chart" viewBox="0 0 600 160" role="img" aria-label="Маржа снижается с 24 до 19 процентов"><path d="M30 30H570M30 85H570M30 140H570" stroke="#d4e0e8" fill="none"/><path d="M40 32L165 54L290 76L415 115L550 135" stroke="#276d91" stroke-width="3" fill="none"/><g fill="#294556" font-size="16" font-family="DIN"><text x="28" y="23">24%</text><text x="532" y="124">19%</text></g></svg><div class="actions">'+button('Поручить анализ причин','task','primary')+'</div></div>';}else{h+='<div class="task"><label class="text-label" for="report-request">Требования к отчёту</label><textarea class="text-input" id="report-request" rows="4">Показать выручку, затраты и маржу по подразделениям за май–сентябрь.</textarea><div class="actions">'+button('Подготовить пример отчёта','report','primary')+'</div></div>';}}
if(st.questions.length){h+='<div class="thread">'+st.questions.filter(x=>x.context===s.section+'|'+s.sub+'|'+s.type+'|'+s.role).map(x=>`<div class="message user"><small>Вы</small>${esc(x.question)}</div><div class="message"><small>DeepAgent AI · ${esc(f.name)}</small>${esc(x.answer)}</div>`).join('')+'</div>';}
$('#content').innerHTML=h;}
function handle(a){const st=stores[s.firm];if(a==='task'||a==='new-task'){if(a==='new-task'){st.task=null;st.submitted=false;st.approved=false;}s.section='Персонал';s.sub='Дополнительные задачи';render();}if(a==='results'){s.sub='Выполнено / Результаты';render();}if(a==='assign'){const title=$('#task-title').value.trim();if(!title){$('#task-title').focus();return;}st.task={title,detail:$('#task-detail').value,deadline:$('#task-deadline').value,assignee:person()};render();}if(a==='finish'){st.submitted=true;s.sub='Выполнено / Результаты';render();}if(a==='approve'){st.approved=true;render();}if(a==='personnel'){s.section='Персонал';s.sub=menus.Персонал[0];render();}if(a==='report'){s.section='Отчёты';s.sub=menus.Отчёты[0];render();}if(a==='save')$('#save-message').textContent='Регламент сохранён в текущем демо.';if(a==='resolve')$('#resolve-message').textContent='Запрос материала разрешён. Ожидается отчёт по сменам.';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.section){s.section=b.dataset.section;s.sub=menus[s.section][0];render();}if(b.dataset.type){s.type=b.dataset.type;render();}if(b.dataset.role!==undefined){s.role=+b.dataset.role;render();}if(b.dataset.sub){s.sub=b.dataset.sub;render();}if(b.dataset.firm!==undefined){s.firm=+b.dataset.firm;render();}if(b.dataset.action)handle(b.dataset.action);});$('#previous-firm').onclick=()=>changeFirm(-1);$('#next-firm').onclick=()=>changeFirm(1);let lastWheel=-Infinity;$('#firms').addEventListener('wheel',e=>{e.preventDefault();const now=performance.now();if(now-lastWheel>350&&Math.abs(e.deltaY)>4){changeFirm(e.deltaY>0?1:-1);lastWheel=now;}},{passive:false});
$('#ask-form').addEventListener('submit',e=>{e.preventDefault();const input=$('#question'),question=input.value.trim();if(!question)return;stores[s.firm].questions.push({question,context:s.section+'|'+s.sub+'|'+s.type+'|'+s.role,answer:'В контексте «'+firms[s.firm].name+' / '+s.sub+'» могу сопоставить материалы и подготовить выводы для согласования. Это демонстрационный ответ.'});input.value='';render();});$('#question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#ask-form').requestSubmit();}});
function tourAt(t){const stage=t<2?0:t<4?1:t<6?2:t<8?3:t<10?4:t<13?5:t<16?6:t<19?7:8;if(window.lastTourStage===stage)return;window.lastTourStage=stage;s.firm=stage===0?1:0;s.role=2;s.type=stage===2?'Штатный':'ИИ-агенты';s.section=stage<2?'Отдел':stage===8?'Отчёты':'Персонал';s.sub=stage===0?'Продажи':stage===1?'Производство':stage===8?'Шаблонные отчёты':stage<4?'Обязанности и функционал':stage<6?'Дополнительные задачи':'Выполнено / Результаты';stores[0].task=stage>=5?{title:'Выяснить причины снижения маржи',detail:'Сопоставить закупки, производство и продажи. Указать источники и план действий.',deadline:'Сегодня, 15:00',assignee:'Менеджер · ИИ'}:null;stores[0].submitted=stage>=6;stores[0].approved=stage>=7;render();}
function stopTour(){clearInterval(tourTimer);tourRunning=false;$('#tour').textContent='▶ Показать маршрут';document.body.classList.remove('film');}$('#tour').onclick=()=>{if(tourRunning){stopTour();return;}tourRunning=true;tourStarted=performance.now();window.lastTourStage=-1;$('#tour').textContent='■ Остановить';document.body.classList.add('film');tourAt(0);tourTimer=setInterval(()=>{const t=(performance.now()-tourStarted)/1000;tourAt(t);$('#tour-progress').style.width=Math.min(t/22*100,100)+'%';if(t>=22)stopTour();},100);};window.deepAgentDemo={setTime:t=>{document.body.classList.add('film');tourAt(t);$('#tour-progress').style.width=Math.min(t/22*100,100)+'%';},state:()=>({...s}),stores:()=>stores};render();
})();
</script></body></html>
