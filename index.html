<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>MINDI — GENRON</title>
<style>@font-face{font-family:DIN;src:url('./assets/DINPro-Regular.otf')}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#303842;font:16px DIN,Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;background:#fff;z-index:2}button{font:inherit;border:0;border-radius:22px;padding:10px 18px;background:#e8f6ff;color:#086c9c;cursor:pointer}#update{position:fixed;right:16px;top:16px;z-index:3;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:20px;background:#ffffffeb;box-shadow:0 4px 24px #0002;backdrop-filter:blur(18px)}[hidden]{display:none!important}</style></head>
<body><div id="loading" role="status"><span id="status">Открываем актуальную версию MINDI…</span><button id="retry" hidden>Повторить</button></div><div id="update" hidden><span>Доступна новая версия. </span><button id="refresh">Обновить</button></div><iframe id="app" title="MINDI" hidden></iframe><noscript>Для работы MINDI включите JavaScript.</noscript>
<script>
(()=>{'use strict';const frame=document.querySelector('#app'),loading=document.querySelector('#loading'),status=document.querySelector('#status'),retry=document.querySelector('#retry'),update=document.querySelector('#update');let current='',next='',checking=false,timer;
function open(release){current=release;next='';update.hidden=true;loading.hidden=false;retry.hidden=true;status.textContent='Открываем актуальную версию MINDI…';frame.hidden=false;frame.src=new URL('./releases/'+release+'/?embedded=1',location.href).href;clearTimeout(timer);timer=setTimeout(()=>{status.textContent='Загрузка занимает больше времени. Проверьте подключение и повторите.';retry.hidden=false;},20000);}
async function check(){if(checking)return;checking=true;try{const response=await fetch(new URL('./release.json?t='+Date.now(),location.href),{cache:'no-store'});if(!response.ok)throw Error();const manifest=await response.json();if(!/^\d{8}-[a-f0-9]{12}$/.test(manifest.release))throw Error();if(!current)open(manifest.release);else if(manifest.release!==current){next=manifest.release;update.hidden=false;}}catch{if(!current){status.textContent='Не удалось проверить актуальную версию. Проверьте подключение и повторите.';retry.hidden=false;}}finally{checking=false;}}
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==='deepagent-ready'&&event.data.release===current){clearTimeout(timer);loading.hidden=true;}});
retry.onclick=()=>current?open(current):check();document.querySelector('#refresh').onclick=()=>{if(next)open(next);};window.addEventListener('pageshow',check);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});setInterval(()=>{if(!document.hidden)check();},60000);check();})();
</script></body></html>
